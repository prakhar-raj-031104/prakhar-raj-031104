<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Prakhar Raj Singhal — Founding Engineer @ AgentLine">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="35%" stop-color="#203a43"/>
      <stop offset="70%" stop-color="#2c5364"/>
      <stop offset="100%" stop-color="#4FE3D0"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4FE3D0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B7CF6" stop-opacity="0.35"/>
    </linearGradient>
    <style>
      .name { font: 700 46px "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: 2px; }
      .desc { font: 500 17px "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #e6fffb; letter-spacing: 0.5px; }
      .fade { opacity: 0; animation: fadeIn 1.6s ease-out forwards; }
      @keyframes fadeIn { to { opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="220" fill="url(#g)"/>

  <path fill="url(#wave)" d="M0,150 C200,200 400,100 600,150 C800,200 1000,100 1200,150 L1200,220 L0,220 Z">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0,150 C200,200 400,100 600,150 C800,200 1000,100 1200,150 L1200,220 L0,220 Z;
              M0,150 C200,100 400,200 600,150 C800,100 1000,200 1200,150 L1200,220 L0,220 Z;
              M0,150 C200,200 400,100 600,150 C800,200 1000,100 1200,150 L1200,220 L0,220 Z"/>
  </path>
  <path fill="#ffffff" fill-opacity="0.08" d="M0,170 C300,120 600,220 900,170 C1050,145 1150,160 1200,170 L1200,220 L0,220 Z"/>

  <g class="fade">
    <text x="600" y="95" text-anchor="middle" class="name">PRAKHAR RAJ SINGHAL</text>
    <text x="600" y="130" text-anchor="middle" class="desc">Founding Engineer @ AgentLine · Backend &amp; Infrastructure · Agentic AI</text>
  </g>
</svg>
